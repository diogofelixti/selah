<!doctype html>
<html lang="pt-BR" data-theme="aurora">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#f7f2ea" />
    <meta name="description" content="Selah · Leitura bíblica. Leia a Bíblia com calma e acompanhe seu progresso." />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Selah" />
    <title>Selah</title>
    <!-- Aplica o tema escolhido (ou o do aparelho) antes de o app carregar os ajustes, sem clarão. -->
    <script>
      (function () {
        var themes = ['aurora', 'noite', 'pergaminho', 'oliveira']
        var saved = null
        try { saved = localStorage.getItem('selah-theme') } catch (e) {}
        var dark = matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = themes.indexOf(saved) >= 0 ? saved : dark ? 'noite' : 'aurora'
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
