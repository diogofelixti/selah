<!doctype html>
<html lang="pt-BR" data-theme="aurora">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#f7f2ea" />
    <meta name="description" content="Selah · Leitura bíblica. Leia a Bíblia com calma e acompanhe seu progresso." />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/pwa-64x64.png" type="image/png" sizes="64x64" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Selah" />
    <title>Selah</title>
    <!-- Aplica o tema escolhido (ou o do aparelho) antes de o app carregar os ajustes, sem clarão. -->
    <script>
      (function () {
        var themes = ['aurora', 'noite', 'pergaminho', 'oliveira']
        var saved = null
        try { saved = localStorage.getItem('selah-theme') } catch (e) {}
        var dark = matchMedia('(prefers-color-scheme: dark)').matches
        var theme = themes.indexOf(saved) >= 0 ? saved : dark ? 'noite' : 'aurora'
        document.documentElement.dataset.theme = theme
        // Cor da barra do navegador igual ao --bg de cada tema.
        var bars = { aurora: '#f7f2ea', noite: '#12161f', pergaminho: '#f1e7d0', oliveira: '#1b1f16' }
        document.querySelector('meta[name="theme-color"]').setAttribute('content', bars[theme])
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
