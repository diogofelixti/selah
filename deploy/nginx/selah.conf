server {
    listen 80;
    server_name selah.selatech.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name selah.selatech.com.br;

    # Origin Certificate curinga da Cloudflare, o mesmo usado por selatech.com.br.
    ssl_certificate     /etc/ssl/cloudflare/selatech.pem;
    ssl_certificate_key /etc/ssl/cloudflare/selatech.key;

    root /var/www/selah;
    index index.html;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml application/manifest+json;

    # Arquivos que precisam sempre ser conferidos, para o app atualizar.
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location = /registerSW.js { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Arquivos com hash no nome não mudam nunca.
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }

    location /bibles/ { add_header Cache-Control "public, max-age=86400"; }

    location / { try_files $uri $uri/ /index.html; }
}
