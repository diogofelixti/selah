# /etc/nginx/sites-available/selah (link em sites-enabled)
server {
    listen 80;
    listen [::]:80;
    server_name selah.selatech.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name selah.selatech.com.br;

    # Certificado de origem da Cloudflare (precisa cobrir *.selatech.com.br).
    ssl_certificate /etc/ssl/cloudflare/selatech.pem;
    ssl_certificate_key /etc/ssl/cloudflare/selatech.key;

    root /srv/selah/app;
    index index.html;

    # Cabeçalhos de segurança: o nginx só herda add_header quando o location não tem os próprios,
    # e todos os locations abaixo definem Cache-Control. Por isso eles se repetem em cada um.

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml application/manifest+json;

    # Checagem de saúde só para o próprio servidor (monitoramento local).
    location = /api/health {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:8787;
    }

    location /api/ {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        # O firewall só deixa a Cloudflare chegar aqui, então este cabeçalho é confiável.
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 16k;
    }

    # Arquivos com hash no nome nunca mudam.
    location /assets/ {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Bíblias mudam só com versão nova do cache no app.
    location /bibles/ {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "public, max-age=604800";
    }

    # Service worker e página: sempre conferir se há versão nova.
    location ~ ^/(sw\.js|registerSW\.js|index\.html)$ {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "no-cache";
    }
    # O nginx não conhece a extensão .webmanifest.
    location = /manifest.webmanifest {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    location / {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
